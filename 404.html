<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#FDFDFC" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
	<meta name="robots" content="noindex">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap">
	<style>
		/* Self-contained: GitHub serves this file for any missing path,
		   so a relative stylesheet link cannot be relied on here. */
		:root { --bg:#FDFDFC; --text:#555555; --title:#21201C; }
		@media (prefers-color-scheme: dark) { :root { --bg:#111110; --text:#B5B3AD; --title:#EEEEEC; } }
		html { background-color:var(--bg); font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-weight:400; }
		body { font-size:1em; color:var(--text); line-height:1.65em; margin:0 auto; margin-top:10%; margin-bottom:5em; padding:0 10%; max-width:644px; -webkit-font-smoothing:antialiased; }
		h1 { font-size:1em; margin-top:1.5em; margin-bottom:1.5em; font-weight:650; color:var(--title); }
		.title { margin:0; font-weight:650; }
		.sub { margin:0; }
		p { font-size:1em; margin-top:0.5em; margin-bottom:1em; }
		a:link, a:visited { color:var(--title); font-weight:500; text-decoration:none; }
		a:hover { text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; }
		.titlelink { font-weight:600; }
		.titlelink:hover { text-decoration:none; }
		.vowel { display:inline-block; max-width:0; opacity:0; overflow:hidden; vertical-align:bottom;
			transition:max-width 340ms cubic-bezier(.22,.61,.36,1), opacity 260ms ease; }
		.titlelink:hover .vowel { max-width:1.2ch; opacity:1; }
		@keyframes fadeInFromBottom { from { opacity:0; transform:translateY(0.5em); } to { opacity:1; transform:none; } }
		body > * { animation:fadeInFromBottom 900ms ease forwards; opacity:0; }
		body > *:nth-child(2) { animation-delay:60ms; }
		body > *:nth-child(3) { animation-delay:120ms; }
		body > *:nth-child(4) { animation-delay:180ms; }
		@media (prefers-reduced-motion: reduce) { body > * { animation:none; opacity:1; transform:none; } .vowel { transition:none; } }
	</style>
	<title>Not found · cntxt</title>
</head>
<body>

	<h1 class="title"><a class="titlelink" href="/">c<span class="vowel">o</span>nt<span class="vowel">e</span>xt</a></h1>
	<p class="sub">A software company, based in New Zealand.</p>

	<h1>Not found</h1>

	<p>There is nothing at this address. <a href="/">Head back</a> and try again.</p>

</body>
</html>
