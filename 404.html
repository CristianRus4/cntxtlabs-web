<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#FDFDFC" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
	<meta name="robots" content="noindex">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&display=swap">
	<style>
		/* Self-contained: GitHub serves this file for any missing path,
		   so a relative stylesheet link cannot be relied on here. */
		:root { --bg:#FDFDFC; --text:#555555; --title:#21201C; --faint:#AEACA6; }
		@media (prefers-color-scheme: dark) { :root { --bg:#111110; --text:#B5B3AD; --title:#EEEEEC; --faint:#56544E; } }
		*, *::before, *::after { box-sizing: border-box; }
		html { background-color:var(--bg); font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; font-weight:350; }
		body { font-size:1em; color:var(--text); line-height:1.65em; margin:0 auto; padding:6em 1.5em 2em;
			max-width:calc(800px + 3em); min-height:100vh; display:flex; flex-direction:column; -webkit-font-smoothing:antialiased; }
		h1 { font-size:1em; margin-top:1.5em; margin-bottom:1.5em; font-weight:650; color:var(--title); }
		.title { margin:0; font-weight:800; }
		.sub { margin:0; }
		p { font-size:1em; margin-top:0.5em; margin-bottom:1em; }
		a:link, a:visited { color:var(--title); font-weight:500; text-decoration:none;
			background-image:linear-gradient(currentColor,currentColor); background-repeat:no-repeat;
			background-position:0 100%; background-size:0 2px; padding-bottom:2px;
			transition:background-size 300ms cubic-bezier(.22,.61,.36,1); }
		a:hover { background-size:100% 2px; }
		.titlelink { font-weight:800; background-image:none; }
		.reveals { background-image:none; }
		.grow { display:inline-block; max-width:0; opacity:0; overflow:hidden; vertical-align:bottom;
			transition:max-width 340ms cubic-bezier(.22,.61,.36,1), opacity 260ms ease; }
		.reveals:hover .grow { max-width:8ch; opacity:1; }
		footer { font-size:1em; margin-top:auto; padding-top:0.75em; border-top:1px dashed var(--faint); color:var(--faint); }
		footer p { margin:0; }
		@keyframes fadeInFromBottom { from { opacity:0; transform:translateY(0.5em); } to { opacity:1; transform:none; } }
		body > * { animation:fadeInFromBottom 900ms ease forwards; opacity:0; }
		body > *:nth-child(2) { animation-delay:60ms; }
		body > *:nth-child(3) { animation-delay:120ms; }
		body > *:nth-child(4) { animation-delay:180ms; }
		@media (prefers-reduced-motion: reduce) { body > * { animation:none; opacity:1; transform:none; } .grow, a { transition:none; } }
	</style>
	<title>Not found · cntxt</title>
</head>
<body>

	<h1 class="title"><a class="titlelink reveals" href="/">c<span class="grow">o</span>nt<span class="grow">e</span>xt</a></h1>
	<p class="sub">A software company, based in New Zealand.</p>

	<h1>Not found</h1>

	<p>There is nothing at this address. <a href="/">Return to the home page</a>.</p>

	<footer>
		<p>cntxt &ndash; Coded in <span class="reveals">N<span class="grow">ew </span>Z<span class="grow">ealand</span></span> &ndash; &copy; <span class="year"></span></p>
	</footer>

	<script>document.querySelectorAll(".year").forEach(function(e){e.textContent=new Date().getFullYear();});</script>
</body>
</html>
