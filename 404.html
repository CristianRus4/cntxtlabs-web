<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#F7F7F7" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#070707" media="(prefers-color-scheme: dark)">
	<meta name="robots" content="noindex">
	<style>
		/* Self-contained: GitHub serves this file for any missing path,
		   so a relative stylesheet link cannot be relied on here. */
		:root { --bg:#F7F7F7; --text:#222222; --muted:#A1A1AA; --rule:#D6D6D6; --blue:#00B2FF; }
		@media (prefers-color-scheme: dark) { :root { --bg:#070707; --text:#F0F0F0; --muted:#71717A; --rule:#2A2A2A; --blue:#00B2FF; } }
		*, *::before, *::after { box-sizing: border-box; }
		html { background-color:var(--bg); font-size:15px; font-weight:400;
			font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
		::selection { background-color:rgba(0,178,255,0.22); }
		body { font-size:1rem; color:var(--text); line-height:1.6; margin:0 auto; padding:15em 1.5em 2em;
			max-width:calc(600px + 3em); min-height:100vh; display:flex; flex-direction:column; }
		@media (max-width: 34rem) { body { padding-top:5em; } }
		h1 { font-size:1rem; margin-top:2.5em; margin-bottom:1.5em; font-weight:500; color:var(--text); }
		.title { margin:0; font-weight:700; }
		.sub { margin:0; }
		p { font-size:1rem; margin-top:0; margin-bottom:1.2em; }
		a:link, a:visited { color:var(--text); font-weight:500; text-decoration:none; transition:color 170ms ease; }
		a:hover { color:var(--blue); }
		.titlelink { font-weight:700; }
		.titlelink:hover { color:var(--blue); }
		.grow { display:inline-block; max-width:0; opacity:0; overflow:hidden; vertical-align:bottom; white-space:nowrap;
			transition:max-width 340ms cubic-bezier(.22,.61,.36,1), opacity 260ms ease; }
		.reveals:hover .grow { max-width:8ch; opacity:1; }
		.reveals:hover .grow-wide { max-width:40ch; }
		.strike { text-decoration:line-through; text-decoration-color:transparent; text-decoration-thickness:1px;
			transition:text-decoration-color 200ms ease; }
		.reveals:hover .strike { text-decoration-color:currentColor; }
		@media (max-width: 34rem) { .grow-wide { display:none; } }
		footer { font-size:1rem; margin-top:auto; padding-top:0.75em; border-top:1px dashed var(--rule); color:var(--muted); }
		footer p { margin:0; }
		@keyframes fadeInFromBottom { from { opacity:0; transform:translateY(0.5em); } to { opacity:1; transform:none; } }
		body > * { animation:fadeInFromBottom 900ms ease forwards; opacity:0; }
		body > *:nth-child(2) { animation-delay:60ms; }
		body > *:nth-child(3) { animation-delay:120ms; }
		body > *:nth-child(4) { animation-delay:180ms; }
		@media (prefers-reduced-motion: reduce) { body > * { animation:none; opacity:1; transform:none; } .grow, .strike, a { transition:none; } }
	</style>
	<title>Not found · cntxt</title>
</head>
<body>

	<h1 class="title"><a class="titlelink reveals" href="/">c<span class="grow">o</span>nt<span class="grow">e</span>xt</a></h1>
	<p class="sub">A software company, based in <span class="reveals"><span class="strike">New Zealand</span><span class="grow grow-wide">&nbsp;the most beautiful place in the world</span></span>.</p>

	<h1>Not found</h1>

	<p>There is nothing at this address. <a href="/">Return to the home page</a>.</p>

	<footer>
		<p>cntxt &ndash; Coded in <span class="reveals">N<span class="grow">ew </span>Z<span class="grow">ealand</span></span> &ndash; &copy; <span class="reveals"><span class="grow">2017 to&nbsp;</span><span class="year"></span></span></p>
	</footer>

	<script>document.querySelectorAll(".year").forEach(function(e){e.textContent=new Date().getFullYear();});</script>
</body>
</html>
