<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
	<meta name="robots" content="noindex">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap">
	<style>
		/* Self-contained: GitHub serves this from the site root for any path,
		   so a relative stylesheet link cannot be relied on here. */
		:root { --paper:#fff; --ink:#111; }
		@media (prefers-color-scheme: dark) { :root { --paper:#0d0d0d; --ink:#f2f2f2; } }
		body { margin:0; padding:12vh 1.5rem 6rem; background:var(--paper); color:var(--ink);
			font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
			font-size:1rem; line-height:1.65; -webkit-font-smoothing:antialiased; }
		.wrap { max-width:40rem; margin:0 auto; }
		h1 { margin:0; font-size:1rem; font-weight:700; line-height:1.65; }
		p { margin:0 0 1.5rem; }
		a { color:inherit; font-weight:600; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; }
		a:hover { text-decoration-thickness:2px; }
		@keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
		.reveal > * { animation:rise 420ms cubic-bezier(.22,.61,.36,1) backwards; }
		.reveal > *:nth-child(2) { animation-delay:45ms; }
		.reveal > *:nth-child(3) { animation-delay:90ms; }
		@media (prefers-reduced-motion: reduce) { .reveal > * { animation:none; opacity:1; transform:none; } }
	</style>
	<title>Not found — cntxt</title>
</head>
<body>
	<div class="wrap reveal">
		<h1>Not found</h1>
		<p class="sub">There is nothing at this address.</p>

		<p><a href="/">Back to cntxt</a></p>
	</div>
</body>
</html>
