<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<!-- A private test page for the footer's physics: kept out of search and linked from nowhere. -->
	<meta name="robots" content="noindex, nofollow">
	<title>Levo footer physics test</title>
	<base href="../">
	<link rel="icon" href="../favicon.svg" type="image/svg+xml">
	<script>(function (r) { r.classList.add("js"); var t = /[?&]theme=(light|dark)\b/.exec(location.search); if (t ? t[1] === "dark" : matchMedia("(prefers-color-scheme: dark)").matches) r.classList.add("dark"); })(document.documentElement);</script>
	<link rel="stylesheet" href="levo.css?v=50">
	<link rel="stylesheet" href="footer.css?v=50">
	<style>
		.pt-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px; padding: 14px 16px; font-size: 14px; color: var(--muted); background: var(--bg); }
		.pt-bar select, .pt-bar button, .pt-seg a { font: inherit; font-weight: 500; color: var(--text); background: rgb(var(--ink) / 0.06); border: 0; border-radius: 9px; padding: 7px 12px; text-decoration: none; cursor: pointer; }
		.pt-bar select { padding-right: 28px; max-width: 78vw; }
		.pt-seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: 11px; background: rgb(var(--ink) / 0.06); }
		.pt-seg a { background: none; color: var(--muted); padding: 5px 11px; }
		.pt-seg a[aria-current] { background: var(--bg); color: var(--text); box-shadow: 0 1px 3px rgb(0 0 0 / 0.12); }
		.pt-stat { width: 100%; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; }
		.pt-gap { height: 34vh; }
		.pt-count { position: fixed; right: 16px; bottom: 16px; z-index: 10; padding: 8px 12px; border-radius: 10px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; color: var(--text); background: rgb(var(--ink) / 0.08); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
	</style>
</head>
<body>
	<div class="pt-bar">
		<button type="button" data-prev aria-label="Previous">←</button>
		<select data-pick aria-label="Variant"></select>
		<button type="button" data-next aria-label="Next">→</button>
		<button type="button" data-replay>Replay</button>
		<span class="pt-seg" data-themes></span>
		<span class="pt-stat" data-stat>type a number or ← → to switch · R to replay</span>
	</div>
	<div class="pt-gap"></div>
	<div class="pt-count" data-count aria-live="polite">0 of 9 out</div>

	<footer class="foot lf" data-lf>
		<nav class="lf-links" aria-label="Levo">
			<a href="../">Cntxt Labs</a>
			<a href="mailto:support@cntxtlabs.co?subject=Levo%20support%20%26%20feedback">Contact</a>
			<a href="legal/#privacy">Privacy</a>
			<a href="legal/#terms">Terms</a>
			<span class="lf-copy">© <span data-lf-year>2026</span></span>
		</nav>
		<div class="lf-stage" data-spill aria-hidden="true">
			<canvas class="lf-word" data-word aria-hidden="true"></canvas>
			<img class="lf-bin" data-bin src="img/dock/trash-full.png" width="128" height="128" alt="" draggable="false">
		</div>
	</footer>

	<script src="test/variants.js?v=50"></script>
	<script>
		// One variant at a time: its number and the theme live in the address; switching or Replay
		// reloads, so only the chosen engine is ever loaded and every run starts clean.
		(function () {
			var list = window.LF_VARIANTS, q = new URLSearchParams(location.search);
			var n = Math.max(1, Math.min(list.length, parseInt(q.get("n"), 10) || 1)), V = list[n - 1];
			var theme = document.documentElement.classList.contains("dark") ? "dark" : "light";
			function go(k, val) { var p = new URLSearchParams(location.search); p.set(k, val); location.search = p.toString(); }
			var pick = document.querySelector("[data-pick]");
			pick.innerHTML = list.map(function (x, i) { return '<option value="' + (i + 1) + '"' + (i + 1 === n ? " selected" : "") + ">" + (i + 1) + ". " + x.name + "</option>"; }).join("");
			pick.addEventListener("change", function () { go("n", pick.value); });
			document.querySelector("[data-prev]").addEventListener("click", function () { go("n", n > 1 ? n - 1 : list.length); });
			document.querySelector("[data-next]").addEventListener("click", function () { go("n", n < list.length ? n + 1 : 1); });
			document.querySelector("[data-replay]").addEventListener("click", function () { location.reload(); });
			document.querySelector("[data-themes]").innerHTML = [["light", "Light"], ["dark", "Dark"]].map(function (t) {
				var p = new URLSearchParams(location.search); p.set("theme", t[0]);
				return '<a href="test/?' + p.toString() + '"' + (t[0] === theme ? ' aria-current="page"' : "") + ">" + t[1] + "</a>";
			}).join("");
			var typed = "", typedTimer = 0;
			document.addEventListener("keydown", function (e) {
				if (e.target === pick || e.metaKey || e.ctrlKey || e.altKey) return;
				// Digits pick a number: one digit, or two typed quickly (1 then 8 is 18).
				if (/^[0-9]$/.test(e.key)) {
					typed += e.key; clearTimeout(typedTimer);
					var want = +typed;
					if (typed.length >= 2 || want * 10 > list.length) { var k = Math.max(1, Math.min(list.length, want)); typed = ""; go("n", k); }
					else typedTimer = setTimeout(function () { var k = Math.max(1, Math.min(list.length, +typed)); typed = ""; go("n", k); }, 500);
				}
				else if (e.key === "ArrowRight") go("n", n < list.length ? n + 1 : 1);
				else if (e.key === "ArrowLeft") go("n", n > 1 ? n - 1 : list.length);
				else if (e.key === "r" || e.key === "R") location.reload();
			});
			var stat = document.querySelector("[data-stat]"), t0 = 0, rested = false;
			function count() { return document.querySelectorAll(".lf-item:not(.is-in)").length + " of " + document.querySelectorAll(".lf-item").length + " out"; }
			// The corner: how many files have left the bin, live, so runs compare at a glance.
			var corner = document.querySelector("[data-count]");
			setInterval(function () { corner.textContent = count(); }, 250);
			// Engines that never quite settle say so, rather than leaving the line blank.
			setInterval(function () { if (!rested && t0 && performance.now() - t0 > 10000) stat.textContent = V.name + " · still moving after " + Math.round((performance.now() - t0) / 1000) + " s · " + count() + " · number or ← → · R to replay"; }, 1000);
			window.LF_STATS = {
				rest: function (frame) {
					rested = true;
					var out = document.querySelectorAll(".lf-item:not(.is-in)").length, all = document.querySelectorAll(".lf-item").length;
					stat.textContent = V.name + " · at rest after " + ((performance.now() - t0) / 1000).toFixed(1) + " s · " + out + " of " + all + " out · number or ← → · R to replay";
				},
				fail: function (err) { stat.textContent = "Couldn't load " + V.engine + ": " + (err && err.message || err); }
			};
			window.LF_VARIANT = V;
			function load(src, done) { var s = document.createElement("script"); s.src = src; s.onload = done; document.body.appendChild(s); }
			load("test/engines/common.js?v=50", function () { load("test/engines/" + V.engine + ".js?v=50", function () { t0 = performance.now(); load("test/scene.js?v=50"); }); });
		})();
	</script>
</body>
</html>
